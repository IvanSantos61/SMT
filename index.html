<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMT - Interativo</title>
    <style>
        body { margin: 0; background-color: #0b0e14; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; overflow-x: hidden; }
        
        #container-geral { position: relative; width: 100%; max-width: 450px; margin-top: 10px; }

        #quadro { position: relative; width: 100%; border: 2px solid #2c3e50; border-radius: 8px; overflow: hidden; background: #000; }
        .fundo { width: 100%; display: block; }
        .fio { position: absolute; top: 0; left: 0; width: 100%; height: auto; display: none; pointer-events: none; }

        /* ZONAS CLICÁVEIS (INVISÍVEIS) */
        .zona {
            position: absolute;
            z-index: 100;
            cursor: pointer;
            border: 2px dashed rgba(255, 204, 0, 0.5); /* REMOVA ESTA LINHA DEPOIS DE AJUSTAR */
            background: rgba(255, 204, 0, 0.1);    /* REMOVA ESTA LINHA DEPOIS DE AJUSTAR */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #ffcc00;
        }

        .zona:hover { background: rgba(255, 204, 0, 0.3); }

        #mensagem { color: #ff4444; font-weight: bold; height: 30px; margin-top: 10px; text-align: center; width: 90%; }
        .btn-reset { margin-top: 20px; padding: 12px 30px; background: #c0392b; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <h2 style="color: #ffcc00; margin-bottom: 0;">Simulador SMT</h2>
    <div id="mensagem">Clique no componente correto para instalar</div>

    <div id="container-geral">
        <div id="quadro">
            <img src="circuito.jpg" class="fundo">
            
            <div class="zona" style="top: 1%; left: 1%; width: 25px; height: 25px;" onclick="verificar('FASE', 18, 0)">1</div>
            <div class="zona" style="top: 6%; left: 1%; width: 25px; height: 25px;" onclick="verificar('FASE2', 18, 1)">2</div>
            <div class="zona" style="top: 17%; left: 10%; width: 25px; height: 25px;" onclick="verificar('FIO VM1', 12, 2)">3</div>
            <div class="zona" style="top: 48%; left: 10%; width: 25px; height: 25px;" onclick="verificar('FIO VM2', 60, 3)">4</div>
            <div class="zona" style="top: 18%; left: 22%; width: 25px; height: 25px;" onclick="verificar('FIO PT1', 12, 4)">5</div>
            <div class="zona" style="top: 70%; left: 45%; width: 25px; height: 25px;" onclick="verificar('FIO PT2', 60, 5)">6</div>

            <div id="camadas"></div>
        </div>
    </div>

    <button class="btn-reset" onclick="location.reload()">REINICIAR TUDO</button>

    <script>
        let passoAtual = 0;

        function verificar(pasta, fim, index) {
            const msg = document.getElementById('mensagem');
            
            if (index === passoAtual) {
                msg.style.color = "#00ff00";
                msg.innerText = "Instalando " + pasta + "...";
                
                play(pasta, fim);
                
                // Esconde a zona clicada para não clicar de novo
                event.target.style.display = 'none';
                passoAtual++;
            } else {
                msg.style.color = "#ff4444";
                msg.innerText = "ERRO: Siga a ordem correta (1 a 6)!";
            }
        }

        function play(pasta, fim) {
            const container = document.getElementById('camadas');
            const framesFase = [0, 5, 12, 18];
            let i = 0;

            let loop = setInterval(() => {
                let frameAtual;
                if (pasta === 'FASE') {
                    if (i < framesFase.length) { frameAtual = framesFase[i]; i++; } 
                    else { clearInterval(loop); return; }
                } else {
                    frameAtual = i * 6;
                    if (frameAtual <= fim) { i++; } 
                    else { clearInterval(loop); return; }
                }

                let num = frameAtual.toString().padStart(4, '0');
                let img = document.createElement('img');
                img.src = pasta + '/quadro' + num + '.png';
                img.className = 'fio';
                img.style.display = 'block';
                container.appendChild(img);
            }, 120);
        }
    </script>
</body>
</html>
