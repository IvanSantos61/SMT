<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMT - Sequencial</title>
    <style>
        body { margin: 0; background-color: #0b0e14; color: white; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        #quadro { position: relative; width: 100%; max-width: 450px; margin-top: 10px; border: 2px solid #2c3e50; border-radius: 8px; overflow: hidden; background: #000; }
        .fundo { width: 100%; display: block; }
        .fio { position: absolute; top: 0; left: 0; width: 100%; height: auto; display: none; pointer-events: none; }
        .painel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 20px; width: 100%; max-width: 450px; }
        
        button { padding: 15px; cursor: pointer; font-weight: bold; background: #1c1c1c; color: #ffcc00; border: 1px solid #ffcc00; border-radius: 6px; text-transform: uppercase; font-size: 10px; transition: 0.3s; }
        
        /* Estilo para botão bloqueado */
        button:disabled { border-color: #444; color: #444; cursor: not-allowed; }
        
        button:active:not(:disabled) { background: #ffcc00; color: #000; transform: scale(0.95); }
        .reset { grid-column: span 2; background: #c0392b; color: #fff; border: 1px solid #e74c3c; margin-top: 5px; }
        
        #mensagem { color: #ff4444; font-weight: bold; height: 20px; margin-top: 10px; font-size: 14px; }
    </style>
</head>
<body>

    <h2 style="color: #ffcc00; margin-bottom: 5px;">Simulador SMT</h2>
    <div id="mensagem"></div>

    <div id="quadro">
        <img src="circuito.jpg" class="fundo">
        <div id="camadas"></div>
    </div>

    <div class="painel">
        <button id="btn-FASE" onclick="verificar('FASE', 18, 0)">1º: Fase 1</button>
        <button id="btn-FASE2" onclick="verificar('FASE2', 18, 1)">2º: Fase 2</button>
        <button id="btn-FIO PT1" onclick="verificar('FIO PT1', 12, 2)">3º: Preto 1</button>
        <button id="btn-FIO PT2" onclick="verificar('FIO PT2', 60, 3)">4º: Preto 2</button>
        <button id="btn-FIO VM1" onclick="verificar('FIO VM1', 12, 4)">5º: Vermelho 1</button>
        <button id="btn-FIO VM2" onclick="verificar('FIO VM2', 60, 5)">6º: Vermelho 2</button>
        
        <button class="reset" onclick="location.reload()">REINICIAR SEQUÊNCIA</button>
    </div>

    <script>
        // Esta variável guarda em qual passo o usuário está
        let passoAtual = 0;

        // Lista da sequência correta (nomes das pastas)
        const sequenciaCorreta = ['FASE', 'FASE2', 'FIO PT1', 'FIO PT2', 'FIO VM1', 'FIO VM2'];

        function verificar(pasta, fim, indexBotao) {
            const msgDiv = document.getElementById('mensagem');
            
            // Se o botão clicado for o esperado na sequência
            if (indexBotao === passoAtual) {
                msgDiv.innerText = ""; // Limpa aviso de erro
                play(pasta, fim);
                
                // Desabilita o botão que já foi usado e marca como concluído
                document.getElementById('btn-' + pasta).style.opacity = "0.5";
                document.getElementById('btn-' + pasta).disabled = true;
                
                passoAtual++; // Avança para o próximo passo
            } else {
                // Se errar a ordem, dá o aviso
                msgDiv.innerText = "ERRO: Siga a sequência correta de montagem!";
                setTimeout(() => { msgDiv.innerText = ""; }, 3000);
            }
        }

        function play(pasta, fim) {
            const container = document.getElementById('camadas');
            const framesFase = [0, 5, 12, 18];
            let i = 0;

            let loop = setInterval(() => {
                let frameAtual;

                if (pasta === 'FASE') {
                    if (i < framesFase.length) {
                        frameAtual = framesFase[i];
                        i++;
                    } else { clearInterval(loop); return; }
                } else {
                    frameAtual = i * 6;
                    if (frameAtual <= fim) { i++; } else { clearInterval(loop); return; }
                }

                let id = 'img-' + pasta + '-' + frameAtual;
                if (!document.getElementById(id)) {
                    let img = document.createElement('img');
                    img.id = id;
                    let num = frameAtual.toString().padStart(4, '0');
                    img.src = pasta + '/quadro' + num + '.png';
                    img.className = 'fio';
                    img.style.display = 'block';
                    container.appendChild(img);
                }
            }, 120);
        }
    </script>
</body>
</html>
